allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  ffmpeg-static: true
  # macOS-only: strips the quarantine xattr from the prebuilt Dawn binary.
  # A no-op on Linux CI, but pnpm fails the install outright when a build
  # script is neither allowed nor explicitly ignored.
  webgpu: true

packages:
  - packages/*
  - apps/*

# TypeDoc 0.28 reads TypeScript compiler internals that TS 7 no longer
# exposes, so the doc generator gets its own supported TypeScript. The
# packages themselves stay on TS 7 — this override is scoped to typedoc.
overrides:
  typedoc>typescript: 5.9.3

minimumReleaseAgeExclude:
  - '@text-rendering-toolkit/font@0.3.0'
  - '@text-rendering-toolkit/layout@0.3.0'
  - '@text-rendering-toolkit/sdf@0.3.0'
  - '@text-rendering-toolkit/three-webgpu@0.3.0'
